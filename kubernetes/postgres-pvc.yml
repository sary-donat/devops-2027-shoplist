# postgres-pvc.yml - request for persistent storage. Products survive when the pod is deleted
apiVersion: v1
kind: PersistentVolumeClaim                #אם הקונטינר נופל כשיעלה יתחבר לפה וידע את ההגדרות which resource requests persistent storage? (three words, no spaces)
metadata:
  name: postgres-pvc        # postgres-deployment requests the storage by this exact name
  namespace: shoplist
spec:
  accessModes:
    - ReadWriteOnce               # only one node writes at a time
  resources:
    requests:
      storage: 1Gi       #כמה גיגה how much space? one gigabyte 
