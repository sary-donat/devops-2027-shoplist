# postgres-secret.yml - postgres passwords
# Values are base64-encoded. How to encode: guide, step 3 (PowerShell or Git Bash)
apiVersion: v1
kind: Secret                 # which resource stores sensitive data?
metadata:
  name: postgres-secret     #איזה שם שרוצים postgres-deployment and backend-deployment look up this exact name
  namespace: shoplist
type: Opaque
data:
  POSTGRES_DB: c2hvcGxpc3QK         #BASE64 כלומר תצפין את המילה שופליסט בצורת קידוד  echo shoplist | base64 לא שמים מידע חשוף אלא רק מקודד  הפקודה שנרשום:
  POSTGRES_USER: c2hvcHVzZXIK      # shopuser, base64-encoded
  POSTGRES_PASSWORD: c2hvcHBhc3MK   # shoppass, base64-encoded
# בגלל שכולם יכולים לפתוח את הקידוד אתן הרשאת גישה לקובץ זה רק למי שארצה שייגש לשם